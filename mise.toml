[tools]
rust = "stable"

[tasks.format]
run = "cargo fmt --all"

[tasks.format-check]
run = "cargo fmt --all --check"

[tasks.lint]
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.typecheck]
run = "cargo check --workspace"

[tasks.test]
run = "cargo test --workspace"

[tasks.check]
run = "cargo fmt --all --check && cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace"

[tasks.release]
raw = true
description = "Publish Rust crates; pass release options after --"
run = "ruby workspace-scripts/release_rust_crates.rb"
