[package]
name = "kettle-rusty"
version = "0.2.0"
repository = "https://github.com/structuredmerge/structuredmerge-rust"
homepage = "https://structuredmerge.org"
authors = ["Peter H. Boling"]
edition = "2024"
description = "Rust crate recipe helpers for Structured Merge"
license = "AGPL-3.0-only OR PolyForm-Small-Business-1.0.0"

[dependencies]
ast-merge = { version = "0.2.0", git = "ssh://git@github.com/structuredmerge/structuredmerge.git", rev = "ddb48f8d8c2025ea486914990e924743ba165dc4" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.9"

[lib]
path = "src/lib.rs"

[[bin]]
name = "kettle-rusty"
path = "src/bin/kettle-rusty.rs"
