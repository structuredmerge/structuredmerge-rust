name: Current

permissions:
  contents: read

on:
  push:
    branches:
      - "main"
      - "*-stable"
    tags:
      - "!*" # Do not execute on tags
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout pinned kernel dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: structuredmerge/structuredmerge
          ref: ddb48f8d8c2025ea486914990e924743ba165dc4
          path: kernel
      - name: Resolve Cargo SSH dependency from authenticated checkout
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."file://${GITHUB_WORKSPACE}/kernel".insteadOf \
            ssh://git@github.com/structuredmerge/structuredmerge.git
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      - name: Run checks
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: mise run check
